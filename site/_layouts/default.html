<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>{{ page.title }} | {{ site.title }}</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #06131f;
        --surface: #0a3447;
        --text: #e9fffc;
        --muted: #b4d4d2;
        --accent: #49e2dc;
        --border: #1b6874;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: radial-gradient(
          circle at top,
          #0b4558 0,
          var(--background) 42rem
        );
        color: var(--text);
        font: 17px/1.65 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          sans-serif;
      }

      main {
        width: min(880px, calc(100% - 2rem));
        margin: 2rem auto;
        padding: clamp(1.25rem, 4vw, 3rem);
        background: color-mix(in srgb, var(--surface) 88%, transparent);
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 35%);
      }

      h1,
      h2 {
        line-height: 1.25;
      }

      h1 {
        margin-top: 0;
      }

      h2 {
        margin-top: 2.2rem;
        color: var(--accent);
      }

      a {
        color: var(--accent);
      }

      code {
        padding: 0.15rem 0.35rem;
        background: #03101a;
        border-radius: 0.3rem;
      }

      footer {
        width: min(880px, calc(100% - 2rem));
        margin: 0 auto 2rem;
        color: var(--muted);
        text-align: center;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>{{ content }}</main>
    <footer>
      Independent Frigate Viewer project ·
      <a href="https://github.com/trcmd9000/frigate-viewer">Source code</a>
    </footer>
  </body>
</html>
