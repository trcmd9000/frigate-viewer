name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, types, lint, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --runInBand --silent --forceExit

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Block critical production advisories
        run: npm audit --omit=dev --audit-level=critical

      - name: Check tracked public files
        shell: bash
        run: |
          set -euo pipefail

          forbidden_files="$(
            git ls-files |
              grep -Ei '(^|/)(\.env($|\.)|local\.properties$|signing\.properties$|google-services\.json$)|\.(jks|keystore|p12|pfx|pem|key|apk|aab)$' ||
              true
          )"
          if [[ -n "$forbidden_files" ]]; then
            echo "Forbidden public files:"
            echo "$forbidden_files"
            exit 1
          fi

          if git grep -I -E -- \
            '-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,}|xox[baprs]-[A-Za-z0-9-]{10,}'
          then
            echo "Potential secret material found in tracked files."
            exit 1
          fi

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Build arm64 debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew app:assembleDebug \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon \
            --stacktrace
