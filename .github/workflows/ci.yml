name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, types, lint, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled JavaScript licenses
        run: npm run licenses:check

      - name: Test
        run: npm test -- --runInBand --silent --forceExit

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Block critical production advisories
        run: npm audit --omit=dev --audit-level=critical

      - name: Check tracked public files
        shell: bash
        run: |
          set -euo pipefail

          forbidden_files="$(
            git ls-files |
              grep -Ei '(^|/)(\.env($|\.)|local\.properties$|signing\.properties$|google-services\.json$)|\.(jks|keystore|p12|pfx|pem|key|apk|aab)$' ||
              true
          )"
          if [[ -n "$forbidden_files" ]]; then
            echo "Forbidden public files:"
            echo "$forbidden_files"
            exit 1
          fi

          if git grep -I -E -- \
            '-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,}|xox[baprs]-[A-Za-z0-9-]{10,}'
          then
            echo "Potential secret material found in tracked files."
            exit 1
          fi

  android:
    name: Android builds
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Build arm64 debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew app:assembleDebug \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon \
            '-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m' \
            --stacktrace

      - name: Verify minified arm64 release APK
        working-directory: android
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/ci-release.keystore" \
            -storepass android \
            -keypass android \
            -alias ci-release \
            -dname "CN=CI" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1
          ./gradlew app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -PMYAPP_UPLOAD_STORE_FILE="$RUNNER_TEMP/ci-release.keystore" \
            -PMYAPP_UPLOAD_STORE_PASSWORD=android \
            -PMYAPP_UPLOAD_KEY_ALIAS=ci-release \
            -PMYAPP_UPLOAD_KEY_PASSWORD=android \
            --no-daemon \
            '-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m' \
            --stacktrace
          unzip -p app/build/outputs/apk/release/app-release.apk classes.dex \
            > "$RUNNER_TEMP/release-classes.dex"
          grep -aFq \
            'com/facebook/react/devsupport/CxxInspectorPackagerConnection' \
            "$RUNNER_TEMP/release-classes.dex"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump resources \
            app/build/outputs/apk/release/app-release.apk \
            > "$RUNNER_TEMP/release-resource-dump.txt"
          for resource in \
            assets_navigation_cameras \
            assets_navigation_events \
            views_author_frigateviewericon; do
            if ! grep -Fq "drawable/$resource" "$RUNNER_TEMP/release-resource-dump.txt"; then
              echo "Missing release resource: $resource"
              exit 1
            fi
          done
